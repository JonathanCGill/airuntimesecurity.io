# Control: NET-04 (control agent egress destinations), NET-01 (network zones),
#          NET-02 (no path that skips guardrails)
# Layer: AIRS Layer 01 - Guardrails (default-deny network posture for agent zones)
#
# Kyverno ClusterPolicy with two rules:
#   1. generate  - materialise a default-deny-egress NetworkPolicy in any
#                  namespace labelled airs.io/egress=controlled, so egress must be
#                  opened explicitly per destination rather than left open.
#   2. validate  - refuse admission of an agent-sandbox pod unless the NAMESPACE
#                  carries airs.io/egress=controlled and the generated
#                  default-deny-egress NetworkPolicy is actually present.
#                  A pod label alone is not sufficient: the pod author controls
#                  its own labels, so trusting one lets a sandbox self-certify
#                  into an unlabelled namespace where rule 1 never fired and no
#                  NetworkPolicy exists. The namespace label and the generated
#                  policy are the facts the pod cannot forge.
#
# Apply with: kubectl apply -f restrict-agent-egress.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-agent-egress
  annotations:
    policies.kyverno.io/title: Restrict agent egress
    policies.kyverno.io/category: AI Security Infrastructure Controls
    policies.kyverno.io/description: >-
      Requires a controlled, default-deny egress posture for agent workloads
      (NET-01/02/04). Generates a default-deny-egress NetworkPolicy per controlled
      namespace and requires agent sandboxes to opt in to it.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: generate-default-deny-egress
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  airs.io/egress: controlled
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-egress
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              # DNS only. Every other destination must be opened by an explicit,
              # reviewed NetworkPolicy that names the allowed host/CIDR (NET-04).
              - to: []
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53
    - name: agent-sandbox-namespace-must-be-controlled
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  airs.io/workload: agent-sandbox
      context:
        # The namespace label is set by a cluster admin, not by the pod author.
        - name: namespaceEgress
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: '"metadata"."labels"."airs.io/egress" || ''unlabelled'''
        # Count rather than GET the policy by name: a GET on a missing object
        # is an API error, whereas a list returns an empty set.
        - name: denyEgressPolicyCount
          apiCall:
            urlPath: "/apis/networking.k8s.io/v1/namespaces/{{ request.namespace }}/networkpolicies"
            jmesPath: "items[?metadata.name == 'default-deny-egress'] | length(@)"
      validate:
        message: >-
          NET-04: an agent-sandbox pod may only run in a namespace labelled
          airs.io/egress=controlled that carries the generated
          default-deny-egress NetworkPolicy. Namespace label is
          '{{ namespaceEgress }}' and {{ denyEgressPolicyCount }} matching
          NetworkPolicy was found. Label the namespace and let rule 1 generate
          the policy; a pod-level label does not substitute for either.
        deny:
          conditions:
            any:
              - key: "{{ namespaceEgress }}"
                operator: NotEquals
                value: controlled
              - key: "{{ denyEgressPolicyCount }}"
                operator: Equals
                value: 0
