<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Comoverlay monitoring cycle</title>
  <desc id="d">Inside an isolated partition fed by a one-way data path, context selects the expected posture from rules, logic and data layers. Trusted sources are fused into a real estimate with uncertainty. The gap between the two is classified as bad data, wrong expectation, real deviation or cannot say, then compared with margins and trigger points. The only outputs are the operator display, showing posture, what is wrong, what cannot be told and the safest expected action, and pre-classified triggers to the separate enforcement point, which may only take responses classified safe at design time.</desc>
  <rect width="820" height="470" fill="white"/>
  <text x="410" y="28" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">Comoverlay: expected vs real, each cycle</text>
  <rect x="140" y="44" width="500" height="330" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="152" y="62" font-family="Public Sans, sans-serif" font-size="11" font-weight="bold" fill="#475569">Monitor partition (read-only, dissimilar from what it watches)</text>
  <g font-family="Public Sans, sans-serif" text-anchor="middle">
    <rect x="10" y="80" width="115" height="62" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="67" y="104" font-size="12" font-weight="bold" fill="#1e293b">Context</text>
    <text x="67" y="120" font-size="10" fill="#475569">stage, event, variant</text>
    <text x="67" y="133" font-size="10" fill="#475569">trusted source only</text>
    <rect x="10" y="230" width="115" height="76" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="67" y="252" font-size="12" font-weight="bold" fill="#1e293b">Sources</text>
    <text x="67" y="268" font-size="10" fill="#475569">traces, gateway,</text>
    <text x="67" y="281" font-size="10" fill="#475569">systems of record,</text>
    <text x="67" y="294" font-size="10" fill="#475569">tool health</text>
    <rect x="160" y="76" width="170" height="70" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="245" y="98" font-size="12" font-weight="bold" fill="#1e293b">Expected posture</text>
    <text x="245" y="115" font-size="10" fill="#475569">rules, logic, data layers</text>
    <text x="245" y="131" font-size="10" fill="#475569">target and band each</text>
    <rect x="160" y="230" width="170" height="76" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="245" y="252" font-size="12" font-weight="bold" fill="#1e293b">Real estimate</text>
    <text x="245" y="268" font-size="10" fill="#475569">trust-weighted fusion,</text>
    <text x="245" y="281" font-size="10" fill="#475569">invariant cross-checks,</text>
    <text x="245" y="294" font-size="10" fill="#475569">value plus uncertainty</text>
    <rect x="360" y="150" width="120" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="420" y="174" font-size="12" font-weight="bold" fill="#1e293b">Gap</text>
    <text x="420" y="190" font-size="10" fill="#475569">z, Mahalanobis,</text>
    <text x="420" y="203" font-size="10" fill="#475569">CUSUM, chains</text>
    <rect x="500" y="76" width="125" height="134" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="562" y="98" font-size="12" font-weight="bold" fill="#1e293b">Classify</text>
    <text x="562" y="118" font-size="10" fill="#475569">1 bad data</text>
    <text x="562" y="134" font-size="10" fill="#475569">2 wrong expectation</text>
    <text x="562" y="150" font-size="10" fill="#475569">3 real deviation</text>
    <text x="562" y="166" font-size="10" fill="#475569">4 can't say</text>
    <text x="562" y="190" font-size="10" font-weight="bold" fill="#991b1b">each one is reported</text>
    <rect x="500" y="236" width="125" height="66" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="562" y="258" font-size="12" font-weight="bold" fill="#1e293b">Margin</text>
    <text x="562" y="274" font-size="10" fill="#475569">distance and time</text>
    <text x="562" y="287" font-size="10" fill="#475569">to limit, triggers</text>
    <rect x="660" y="76" width="150" height="120" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="735" y="98" font-size="12" font-weight="bold" fill="#1e293b">Operator display</text>
    <text x="735" y="118" font-size="10" fill="#475569">posture as it is</text>
    <text x="735" y="134" font-size="10" fill="#475569">what is wrong</text>
    <text x="735" y="150" font-size="10" fill="#475569">what it can't tell</text>
    <text x="735" y="166" font-size="10" fill="#475569">safest expected action</text>
    <text x="735" y="186" font-size="10" font-weight="bold" fill="#166534">advises, never commands</text>
    <rect x="660" y="216" width="150" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="735" y="237" font-size="12" font-weight="bold" fill="#1e293b">Human</text>
    <text x="735" y="253" font-size="10" fill="#475569">revoke, stop, roll back</text>
    <rect x="660" y="296" width="150" height="66" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="735" y="318" font-size="12" font-weight="bold" fill="#1e293b">Enforcement point</text>
    <text x="735" y="334" font-size="10" fill="#475569">separate, acts only on</text>
    <text x="735" y="347" font-size="10" fill="#475569">responses classified safe</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M125,111 L153,111"/>
    <path d="M125,268 L153,268"/>
    <path d="M330,111 L345,111 L345,170 L353,170"/>
    <path d="M330,268 L345,268 L345,192 L353,192"/>
    <path d="M480,170 L493,150"/>
    <path d="M562,210 L562,229"/>
    <path d="M625,136 L653,136"/>
    <path d="M625,280 L645,280 L645,329 L653,329"/>
    <path d="M735,196 L735,209"/>
  </g>
  <g fill="#475569">
    <polygon points="160,111 152,106 152,116"/><polygon points="160,268 152,263 152,273"/>
    <polygon points="360,170 352,165 352,175"/><polygon points="360,192 352,187 352,197"/>
    <polygon points="500,145 490,146 496,154"/><polygon points="562,236 557,228 567,228"/>
    <polygon points="660,136 652,131 652,141"/><polygon points="660,329 652,324 652,334"/>
    <polygon points="735,216 730,208 740,208"/>
  </g>
  <text x="140" y="398" font-family="Public Sans, sans-serif" font-size="11" fill="#334155">One-way data path in. No output path to tools, credentials, or agents.</text>
  <text x="140" y="416" font-family="Public Sans, sans-serif" font-size="11" fill="#334155">Bad data, wrong expectation, and can't say never silence an alarm: each is reported, and can't say counts as lost protection.</text>
  <text x="140" y="434" font-family="Public Sans, sans-serif" font-size="11" fill="#334155">Unanswered alerts escalate to the next human, then the workflow moves to its predefined safe state (EC-2.22).</text>
</svg>
