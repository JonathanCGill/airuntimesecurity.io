<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="ctdTitle ctdDesc">
  <title id="ctdTitle">MASO cyber events tabletop drill scorecard</title>
  <desc id="ctdDesc">Eleven scenarios drawn from cyber events between July and October 2026, scored at Tier 2 against four stages: prevent, contain, detect, recover. Of 44 cells, 11 held, 26 were partial, and 7 were gaps. Gaps cluster in prevention for parser and tool-dispatch flaws, and in recovery where harm reaches third parties.</desc>
