  <text x="40" y="46" fill="#f1f5f9" font-size="22" font-weight="600">Tabletop drill scorecard</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Eleven scenarios from July to October 2026 events, scored against a Tier 2 (Managed) MASO deployment.</text>
  <text x="40" y="92" fill="#94a3b8" font-size="13">Held: a named control stops or bounds it. Partial: depends on configuration, a higher tier, or ordering. Gap: no MASO control.</text>
