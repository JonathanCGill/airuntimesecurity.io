site_name: AI Runtime Security
site_url: https://airuntimesecurity.io/
site_description: >-
  AI Runtime Security (AIRS) | the discipline of monitoring, controlling,
  and constraining AI system behaviour in production environments.
site_author: Jonathan Gill

repo_url: https://github.com/JonathanCGill/airuntimesecurity.io
repo_name: JonathanCGill/airuntimesecurity.io
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  font: false
  palette:
    scheme: default
    primary: custom
    accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - toc.follow
  favicon: images/favicon.svg
  icon: {}

plugins:
  - search
  - meta
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      type: date
  - redirects:
      redirect_maps:
        ABOUT.md: about.md
        ARCHITECTURE.md: architecture.md
        CHANGELOG.md: changelog.md
        CODE_OF_CONDUCT.md: code-of-conduct.md
        CONTRIBUTING.md: contributing.md
        FAQ.md: faq.md
        FAST-LANE.md: fast-lane.md
        IMPLEMENTATION_GUIDE.md: implementation-guide.md
        MATURITY.md: maturity.md
        maso/maso-2.0-distributed-architecture.md: maso/distributed-architecture.md
        PACE-RESILIENCE.md: pace-resilience.md
        QUICK_START.md: quick-start.md
        REFERENCES.md: references.md
        VALIDATED-AGAINST.md: validated-against.md
  - social:
      cards_layout_options:
        background_color: "#1d1d1f"
        color: "#ffffff"
        font_family: Public Sans

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/redesign.css

extra:
  analytics:
    provider: google
    property: G-MTNR4PST40
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JonathanCGill
      name: Jonathan Gill on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jonathancgill/
      name: Jonathan Gill on LinkedIn

copyright: >-
  Copyright &copy; 2026 Jonathan Gill | MIT License<br>
  Feedback welcome | <a href="mailto:feedback@airuntimesecurity.io">feedback@airuntimesecurity.io</a><br>
  MASO (Multi-Agent Security Operations) is a component of the AIRS framework and is not affiliated with, endorsed by, or related to the Monetary Authority of Singapore (MAS).

